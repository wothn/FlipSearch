<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>搜索引擎切换器</title>
        <link rel="stylesheet" href="../styles/popup.css" />
    </head>
    <body>
        <div class="container">
            <input
                type="text"
                id="query-input"
                class="query-input"
                placeholder="当前未在搜索"
            />
            <div id="engines-container" class="engines-list"></div>
            <div class="new-tab-option">
                <label>
                    <input type="checkbox" id="new-tab-checkbox" />
                    在新标签页打开
                </label>
            </div>
            <button id="options-btn" class="options-btn">设置</button>
        </div>
        <script type="module" src="./popup.js"></script>
    </body>
</html>
