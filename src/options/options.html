<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>搜索引擎设置</title>
        <link rel="stylesheet" href="../styles/options.css" />
    </head>
    <body>
        <div class="app-container">
            <!-- 侧边导航 -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="logo">
                        <img src="../../icons/logo.png" alt="logo" />
                        <span>搜索引擎切换器</span>
                    </div>
                </div>
                <nav class="sidebar-nav">
                    <a href="#general" class="nav-item active" data-section="general">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span>通用设置</span>
                    </a>
                    <a href="#appearance" class="nav-item" data-section="appearance">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <span>主题外观</span>
                    </a>
                    <a href="#engines" class="nav-item" data-section="engines">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                        <span>搜索引擎</span>
                    </a>
                </nav>
            </aside>

            <!-- 主内容区 -->
            <main class="main-content">
                <!-- 页面标题 -->
                <header class="page-header">
                    <h1 id="page-title">通用设置</h1>
                    <p class="page-desc" id="page-desc">配置扩展的基本行为</p>
                </header>

                <!-- 通用设置 -->
                <section id="general-section" class="content-section active">
                    <div class="settings-card">
                        <div class="card-header">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="9" y1="21" x2="9" y2="9"></line>
                            </svg>
                            <div>
                                <h3>搜索行为</h3>
                                <p class="card-subtitle">控制搜索结果如何打开</p>
                            </div>
                        </div>
                        <div class="card-body">
                            <label class="toggle-switch">
                                <input type="checkbox" id="new-tab-checkbox" />
                                <span class="toggle-slider"></span>
                                <span class="toggle-label">
                                    <span class="toggle-title">在新标签页打开搜索结果</span>
                                    <span class="toggle-desc">开启后，切换搜索引擎时会新开标签页</span>
                                </span>
                            </label>
                        </div>
                    </div>
                </section>

                <!-- 主题外观 -->
                <section id="appearance-section" class="content-section">
                    <div class="settings-card">
                        <div class="card-header">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                            </svg>
                            <div>
                                <h3>配色主题</h3>
                                <p class="card-subtitle">选择你喜欢的界面风格</p>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="theme-grid" id="theme-selector">
                                <div class="theme-card" data-theme="light">
                                    <div class="theme-preview-wrapper">
                                        <div class="theme-preview light"></div>
                                        <div class="theme-check">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                                <polyline points="20 6 9 17 4 12"></polyline>
                                            </svg>
                                        </div>
                                    </div>
                                    <span class="theme-name">冷灰蓝</span>
                                    <span class="theme-desc">清爽明亮的浅色主题</span>
                                </div>
                                <div class="theme-card" data-theme="dark">
                                    <div class="theme-preview-wrapper">
                                        <div class="theme-preview dark"></div>
                                        <div class="theme-check">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                                <polyline points="20 6 9 17 4 12"></polyline>
                                            </svg>
                                        </div>
                                    </div>
                                    <span class="theme-name">深色模式</span>
                                    <span class="theme-desc">护眼舒适的深色主题</span>
                                </div>
                                <div class="theme-card" data-theme="minimal">
                                    <div class="theme-preview-wrapper">
                                        <div class="theme-preview minimal"></div>
                                        <div class="theme-check">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                                <polyline points="20 6 9 17 4 12"></polyline>
                                            </svg>
                                        </div>
                                    </div>
                                    <span class="theme-name">极简白</span>
                                    <span class="theme-desc">简洁纯粹的黑白风格</span>
                                </div>

                            </div>
                        </div>
                    </div>
                </section>

                <!-- 搜索引擎 -->
                <section id="engines-section" class="content-section">
                    <!-- 统计卡片 -->
                    <div class="stats-bar">
                        <div class="stat-card">
                            <span class="stat-value" id="total-engines">0</span>
                            <span class="stat-label">全部引擎</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="enabled-engines">0</span>
                            <span class="stat-label">已启用</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-value" id="custom-engines">0</span>
                            <span class="stat-label">自定义</span>
                        </div>
                    </div>

                    <!-- 引擎列表卡片 -->
                    <div class="settings-card">
                        <div class="card-header">
                            <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                            <div>
                                <h3>已配置的搜索引擎</h3>
                                <p class="card-subtitle">拖拽调整顺序，点击开关启用/禁用</p>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="engine-list-hint">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 5v14M5 12l7-7 7 7"/>
                                </svg>
                                <span>拖拽引擎可调整排序，排在前面的将显示在弹出窗口的上方</span>
                            </div>
                            <div class="engine-grid" id="engine-list"></div>
                            <button class="reset-btn" id="reset-btn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="23 4 23 10 17 10"></polyline>
                                    <polyline points="1 20 1 14 7 14"></polyline>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                                </svg>
                                还原默认设置
                            </button>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <!-- 添加/编辑引擎模态框 -->
        <div class="modal-overlay" id="engine-modal">
            <div class="modal">
                <div class="modal-header">
                    <h3 id="modal-title">添加搜索引擎</h3>
                    <button class="modal-close" id="modal-close">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-engine-id" value="" />
                    <div class="form-group">
                        <label>
                            引擎名称
                            <span class="label-hint">显示在切换器中的名字</span>
                        </label>
                        <input type="text" id="engine-name" placeholder="例如: Google" />
                    </div>
                    <div class="form-group">
                        <label>
                            URL 模板
                            <span class="label-hint">用 %s 作为搜索词占位符</span>
                        </label>
                        <input type="text" id="engine-url" placeholder="例如: https://www.google.com/search?q=%s" />
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label>
                                搜索参数名
                                <span class="label-hint">用于提取搜索词</span>
                            </label>
                            <input type="text" id="engine-param" placeholder="例如: q" />
                        </div>
                        <div class="form-group half">
                            <label>
                                图标路径
                                <span class="label-hint">留空自动获取 favicon</span>
                            </label>
                            <input type="text" id="engine-icon" placeholder="自动" />
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancel-edit-btn">取消</button>
                    <button class="btn btn-primary" id="add-engine-btn">保存</button>
                </div>
            </div>
        </div>

        <!-- 浮动添加按钮 -->
        <button class="fab" id="fab-add-engine" title="添加搜索引擎">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <div id="status-message"></div>

        <script type="module" src="./options.js"></script>
    </body>
</html>
