<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>设置</title>
        <link rel="stylesheet" href="../styles/options.css" />
    </head>
    <body>
        <h1>搜索引擎设置</h1>

    <div class="settings-section">
      <h2 class="settings-title">通用设置</h2>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="new-tab-checkbox" />
          在新标签页打开搜索结果
        </label>
      </div>
    </div>

    <div class="settings-section">
      <h2 class="settings-title">主题外观</h2>
      <div class="theme-selector" id="theme-selector">
        <div class="theme-option" data-theme="light">
          <div class="theme-preview light"></div>
          <span class="theme-name">冷灰蓝</span>
        </div>
        <div class="theme-option" data-theme="dark">
          <div class="theme-preview dark"></div>
          <span class="theme-name">深色模式</span>
        </div>
        <div class="theme-option" data-theme="minimal">
          <div class="theme-preview minimal"></div>
          <span class="theme-name">极简白</span>
        </div>
      </div>
    </div>

        <div class="container">
            <div class="engine-section">
                <h2 class="section-title">现有搜索引擎</h2>
                <div class="engine-list" id="engine-list"></div>
                <button class="reset-btn" id="reset-btn">还原默认设置</button>
            </div>

            <div class="add-section">
                <h2 class="section-title" id="form-title">添加搜索引擎</h2>
                <input type="hidden" id="edit-engine-id" value="" />
                <div class="form-group">
                    <label>名称:</label>
                    <input
                        type="text"
                        id="engine-name"
                        placeholder="例如: Google"
                    />
                </div>
                <div class="form-group">
                    <label>URL模板 (用 %s 作为搜索词占位符):</label>
                    <input
                        type="text"
                        id="engine-url"
                        placeholder="例如: https://www.google.com/search?q=%s"
                    />
                </div>
                <div class="form-group">
                    <label>搜索参数名:</label>
                    <input
                        type="text"
                        id="engine-param"
                        placeholder="例如: q"
                    />
                </div>
                <div class="form-group">
                    <label>图标路径 (留空自动获取):</label>
                    <input
                        type="text"
                        id="engine-icon"
                        placeholder="留空将自动从网站获取 favicon"
                    />
                </div>
                <div class="form-actions">
                    <button class="add-btn" id="add-engine-btn">添加搜索引擎</button>
                    <button class="cancel-btn" id="cancel-edit-btn" style="display: none;">取消编辑</button>
                </div>
            </div>
        </div>

        <div id="status-message"></div>

        <script type="module" src="./options.js"></script>
    </body>
</html>
